[window]
padding = { x = 5, y = 5 }

[font]
normal = { family = "GeistMono Nerd Font Mono", style = "Regular" }
bold = { family = "GeistMono Nerd Font Mono", style = "Bold" }
italic = { family = "GeistMono Nerd Font Mono", style = "Regular" }
bold_italic = { family = "GeistMono Nerd Font Mono", style = "Bold" }
size = 13

[colors]
cursor = { text = "#151217", cursor = "#767481" }

[colors.primary]
foreground = "#ebe8ed"
background = "#24273a"

[colors.normal]
black = "#1f1d20"
red = "#d64f3d"
green = "#7e70e6"
yellow = "#aba1f7"
blue = "#c27eed"
magenta = "#e963b8"
cyan = "#9488f2"
white = "#ebe8ed"

[colors.bright]
black = "#0b070d"
red = "#eb8275"
green = "#b7aff8"
yellow = "#d1cbfb"
blue = "#e6c8f9"
magenta = "#e963b8"
cyan = "#e0baf7"
white = "#f8f6f9"


